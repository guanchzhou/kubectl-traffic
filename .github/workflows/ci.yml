name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: zig fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Zig 0.17.0
        env:
          ZIG_URL: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          ZIG_SHA: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
        run: |
          curl -fsSL "$ZIG_URL" -o zig.tar.xz
          echo "$ZIG_SHA  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/zig-x86_64-linux-0.17.0" >> "$GITHUB_PATH"
      - name: Check formatting
        run: zig fmt --check src/ tests/ build.zig build.zig.zon

  build-linux:
    name: Build & Test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone sibling dependencies
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          git clone --depth 1 https://github.com/guanchzhou/zig-klient zig-klient
      - name: Install Zig 0.17.0
        env:
          ZIG_URL: https://ziglang.org/download/0.17.0/zig-x86_64-linux-0.17.0.tar.xz
          ZIG_SHA: 1cbe9df9f27e6b78d14ccbca43b6703a404ef79ef1c463de901d7f088d4e2026
          ZIG_DIR: zig-x86_64-linux-0.17.0
        run: |
          curl -fsSL "$ZIG_URL" -o zig.tar.xz
          echo "$ZIG_SHA  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/$ZIG_DIR" >> "$GITHUB_PATH"
      - name: Build
        run: zig build
      - name: Tests
        run: zig build test

  build-macos:
    name: Build & Test (macos)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Clone sibling dependencies
        run: |
          cd "$(dirname "$GITHUB_WORKSPACE")"
          git clone --depth 1 https://github.com/guanchzhou/zig-klient zig-klient
      - name: Install Zig 0.17.0
        env:
          ZIG_URL: https://ziglang.org/download/0.17.0/zig-aarch64-macos-0.17.0.tar.xz
          ZIG_SHA: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
          ZIG_DIR: zig-aarch64-macos-0.17.0
        run: |
          curl -fsSL "$ZIG_URL" -o zig.tar.xz
          echo "$ZIG_SHA  zig.tar.xz" | shasum -a 256 -c -
          tar -xf zig.tar.xz
          echo "$PWD/$ZIG_DIR" >> "$GITHUB_PATH"
      - name: Build
        run: zig build
      - name: Tests
        run: zig build test
